# 开机后等待多久（秒）才加载 LSE 模块
# ⚠ 为什么必须延迟：在开机早期加载会导致【开机卡死循环】（实测过一次，需删模块救援）
#   实测安全值：uptime ≥ 54s；本脚本默认 boot_completed 后再等 120s（约 uptime 150~180s）
DELAY_AFTER_BOOT=120
# 加载后是否立刻把调速器切到 lunar_ext_gov（1=是 0=否）
SWITCH_GOVERNOR=1
# 加载后是否重启 Scene（让它重读配置；1=是 0=否）
# ★ 建议保持 1：Scene 在开机早期会因模块未加载而回退 uag，并缓存下来反复下发
RESTART_SCENE=1
