# fengchi-boot 配置 v2.6（hmbird 与 scx 同时完整在线）
# 改完重启生效，或手动重跑 service.sh
#
# ★v2.6 修订（t125，依据 F:\工作区\_audit\审核-fengchi-boot v2.5.md / t121）★：
#   D4 fail-closed 真正落地：未验证内核（uname -r 解析不出 opt 号）或 opt < MIN_OPT 时，
#     HMBIRD_CTL=0 且 GOV_SWITCH=0，且★HMBIRD_CTL=0 时脚本不再对 hmbird 做任何写或在线探针★；
#     SAFE_RESTORE / VETO_OFF 保留（无害化动作）。
#   F1 内核自禁盲区：真实状态解析改为两路 dmesg 信号【按时间序取最新】
#     （A=hmbird_ctrl() rc= 行；B="hmbird disabled|enabled finished at jiffies = ..." 收尾行）。
#
# ★v2.5 修订★：按 F:\工作区\_audit\审核-fengchi-boot-v2.4.md（t107 独立复核）的 D1~D8 修改。
#   与 v2.4 的默认值差异（逐条对应缺陷号）：
#     KEEP_SCX_ON_IDLE   1 → 0   （D1：退出游戏后不再「裸 scx 常态化」）
#     VETO_OFF           1 → 0   （D6：不再主动拆掉 opt161 的策略层安全垫）
#     新增 MIN_OPT / ALLOW_UNKNOWN_KERNEL / SAFE_RESTORE / ALLOW_BARE_SCX_AT_IDLE /
#          ALLOW_NO_HMBIRD_SCX / HMBIRD_REQUIRE_REAL_STATE / HMBIRD_SETTLE / HMBIRD_PROBE_SEC
#
# ★前提（D2/D4 已自动把关）★：本模块要求内核 >= opt160 且 uname -r 能被解析出 -optN。
#   解析失败或 < opt160 时守护会【fail-closed】：HMBIRD_CTL=0 且 GOV_SWITCH=0（禁止半开），
#   但仍会做「安全的」纠错——把 governor 拉回 IDLE_GOV（SAFE_RESTORE=1）。
#   D13 更正：旧版注释说的「opt160 之前 watchdog 每 60s 抢 governor」已不准确；
#   现在 hmbird_watchdog_workfn（hmbird.c:3762-3823）已无任何 governor 操作。闸门保留的意义是
#   「未验证的内核不放行」。

# 没有游戏时切回的调速器：uag = OPPO 官方默认；walt = Scene 常用；留空 = 不切回
IDLE_GOV=uag

# 检测到游戏时切换到的调速器（正常不要改）
SCX_GOV=scx

# 轮询间隔（秒）
POLL_SEC=4

# 离开游戏后延迟多少秒再切回（避免切出去看一眼就来回切）
IDLE_DELAY=10

# 心跳日志间隔（分钟），0=关闭
HEARTBEAT_MIN=30

# 日志目录与最大行数
LOG_DIR=/sdcard/Download
LOG_MAX=2000

# 关键线程通路：1=检测到第三方组件(ctn_patch/opgs_daemon)就自动拉起；0=不管
OPGS=1

# 关键线程总开关 ct_enable：1=游戏时自动打开、退出还原；0=不碰
CTB=1

# ===== 模式开关 =====
# HMBIRD_CTL：1=游戏时开启内核 hmbird；0=不碰 hmbird（且顺序闸门下不会切 scx，见 D7）
HMBIRD_CTL=1

# GOV_SWITCH：1=游戏时切 scx 调速器；0=不切
# 注意：HMBIRD_CTL=0 时本项会被强制为 0（禁止半开，D7）；要强行绕过需 ALLOW_NO_HMBIRD_SCX=1
GOV_SWITCH=1

# ★顺序闸门★ 1=只有在 hmbird【真状态】在线之后才允许切 scx（必须保持 1）
#   依据 kernel/sched/hmbird/hmbird.c:5016-5022 —— enable 那一刻若 gov 已是 scx，
#   内核会把它踢成 uag 并记 orig_gov（hmbird_gov_unsafe @hmbird.c:3522-3525 只匹配 scx 前缀）。
#   先开 hmbird 再切 scx，这次检查看到的是非 scx => 整个动作不发生。
#   ★v2.5★ 判据已从「/proc 意图值」改为「rc + dmesg 真状态」（D3）。
SCX_REQUIRE_HMBIRD=1

# ★安全 governor 预置★ 1=进游戏时若 gov 已是 scx，先切到 SAFE_GOV 再开 hmbird，
#   使 hmbird_gov_restore() 的 orig_gov 保持为空（hmbird.c:3660-3661 首次记录 / :3712 判空 / :3755 清条目）
SAFE_GOV_PRELOAD=1
SAFE_GOV=uag

# ===== v2.5 新增：安全/闸门旋钮（非必要不要改）=====
# SAFE_RESTORE：1=允许守护在「退出游戏/启动清理」时把 governor 拉回 IDLE_GOV，
#   即使 GOV_SWITCH=0 也生效。这是 D2「半开且永久无纠错」的修复：拉回 IDLE_GOV 永不制造裸 scx。
SAFE_RESTORE=1

# ALLOW_BARE_SCX_AT_IDLE：★危险★ 只有它与 KEEP_SCX_ON_IDLE=1 同时为 1 时，
#   退出游戏后才允许保留裸 scx（hmbird 已关而 governor 仍是 scx）。默认 0。
#   D1 的形态就是这个，所以默认禁止，且开启时每轮都打 WARN。
ALLOW_BARE_SCX_AT_IDLE=0

# ALLOW_NO_HMBIRD_SCX：★危险★ 置 1 才允许「没有 hmbird 也切 scx」（会同时解除 SCX_REQUIRE_HMBIRD=1 的强制）。默认 0。
ALLOW_NO_HMBIRD_SCX=0

# ALLOW_UNKNOWN_KERNEL：0=uname -r 解析不出 -optN 时 fail-closed；1=按本配置执行（D4）。默认 0。
#   ★v2.6（t121 §4）★：本豁免【只对「解析不出 opt 号」这一种情况有效】；
#   opt 号低于 MIN_OPT 时任何开关都不能豁免（要放行只能改下面的 MIN_OPT）。
ALLOW_UNKNOWN_KERNEL=0

# MIN_OPT：内核 opt 号下限，低于它一律 fail-closed（D2/D4）。默认 160。
#   ★v2.6（t121 §4）★：MIN_OPT 以下【不可用 ALLOW_UNKNOWN_KERNEL 豁免】。
MIN_OPT=160

# ★v2.6（F1）★：真状态来源已扩为两路（hmbird_ctrl 行 + "hmbird disabled|enabled finished" 收尾行），
#   内核自禁（hmbird.c:4857）之后本项不会再被上一轮的陈旧 rc=0 骗过。
# HMBIRD_REQUIRE_REAL_STATE：1=不仅要写 rc=0，还要求 dmesg 里出现
#   "hmbird_sched: scx_enable=1 -> hmbird_ctrl() rc=0, enabled=1"（proc_main.c:299-300 的真状态）
#   才允许切 scx；若设备上读不到 dmesg，会保守拒绝切 scx（日志会明确写出来）。默认 1（D3）。
HMBIRD_REQUIRE_REAL_STATE=1

# HMBIRD_SETTLE：疑似「意图残留」时，先写 0 制造边沿后的等待秒数（默认 1）
HMBIRD_SETTLE=1

# HMBIRD_PROBE_SEC：真状态已确认后，每隔多少秒才重新核对一次 dmesg（默认 60，降低 dmesg 开销）
HMBIRD_PROBE_SEC=60

# 退出游戏后是否保留 scx：★v2.5 起本项默认 0，且 idle 分支不再看它★（D1）
#   设 1 会被忽略并打 WARN；真要保留必须同时显式设 ALLOW_BARE_SCX_AT_IDLE=1（危险）。
KEEP_SCX_ON_IDLE=0

# 低频重申间隔（秒）：只在 hmbird 真状态在线、且 governor 掉出 scx 时才补一次；0=关闭
REASSERT_SEC=30

# 启动时把 opt161 的策略层否决强制关掉（1=关，0=不碰）
# ★v2.5 默认 0（D6）★：置 1 会主动拆掉「hmbird 在线时有人切 scx 会被内核拒绝」这唯一一道安全垫，
#   把正确性全押在脚本时序上。上机阶段保持 0。
# 该节点路径未在设备上实测（源码层 param_sysfs_builtin 对无 . 的 core_param 用 modname kernel
#   => /sys/module/kernel/parameters/hmbird_gov_veto）；★节点内容按 kernel/params.c:317-321 是 N/Y，不是 0/1★
VETO_OFF=0
