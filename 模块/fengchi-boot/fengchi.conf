# fengchi-boot 配置（改完重启生效，或手动重跑 service.sh）

# 没有游戏时切回的调速器：uag = OPPO 官方默认（推荐）；walt = Scene 常用；留空 = 不切回
IDLE_GOV=uag

# 检测到游戏时切换到的调速器（正常不要改）
SCX_GOV=scx

# 轮询间隔（秒）
POLL_SEC=4

# 离开游戏后延迟多少秒再切回（避免切出去看一眼就来回切）
IDLE_DELAY=10

# 心跳日志间隔（分钟），0=关闭；日志里会定期打印一次运行状态
HEARTBEAT_MIN=30

# 日志目录与最大行数
LOG_DIR=/sdcard/Download
LOG_MAX=2000

# 关键线程通路：1=检测到第三方组件(ctn_patch/opgs_daemon)就自动拉起；0=不管
OPGS=1

# 关键线程总开关 ct_enable：1=游戏时自动打开、退出还原；0=不碰
CTB=1