# fengchi-boot 配置（改完重启生效，或手动重跑 service.sh）

# 没有游戏时切回的调速器：uag = OPPO 官方默认（推荐）；walt = Scene 常用；留空 = 不切回
IDLE_GOV=uag

# 检测到游戏时切换到的调速器（正常不要改）
SCX_GOV=scx

# 轮询间隔（秒），越小越灵敏、越费电一点
POLL_SEC=4

# 日志目录（放 Download 方便直接看）
LOG_DIR=/sdcard/Download

# 日志最多保留行数，超过会自动截断（防止无限变大）
LOG_MAX=2000

# 关键线程通路（critical_task_boost）：1=检测到第三方 OPGS 组件就自动拉起；0=不管
# 需要系统里已安装提供 ctn_patch.ko / opgs_daemon 的组件（例如 SCRC）
OPGS=1