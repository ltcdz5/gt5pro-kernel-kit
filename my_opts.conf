# ===== GT5 Pro 自编内核 · 我们的配置追加 =====
# 用法: 把本文件内容追加到 common/arch/arm64/configs/gki_defconfig 末尾, 然后重跑 builder
# (重复行无害, Kconfig 取最后一条)
# ⚠️ 编完必须回读: ./scripts/extract-ikconfig out/arch/arm64/boot/Image | grep -E 'CONFIG_XXX'
#
# ⛔ 不要加任何 CONFIG_OPLUS_FEATURE_* 开关 —— kernel/oplus_cpu/ 整个目录不参与编译
#    (全树 Makefile 只有 kernel/Makefile:142 引用了它的 sched/sched_tune/ 一个子目录),
#    写了等于没写(2026-09-29 实测: System.map / out 里的 .o / Image 字符串 三重验证全无)。
#    这些功能由厂商预装的 .ko 提供(开机日志里 oplus_bsp_task_cpustats / oplus_bsp_eas_opt 等都在跑)，
#    原厂 config 里对应开关也全是 not set。

# ---- [opt1] 网络: 拥塞控制算法(可选算法集; 默认值由 opt2 决定) ----
CONFIG_TCP_CONG_ADVANCED=y
CONFIG_TCP_CONG_BBR=y
CONFIG_TCP_CONG_BRUTAL=y
CONFIG_TCP_CONG_VEGAS=y
CONFIG_TCP_CONG_WESTWOOD=y
CONFIG_TCP_CONG_HTCP=y
CONFIG_TCP_CONG_NV=y

# ---- [opt1] 网络: 出网队列调度器(治"满速下载时其他应用卡") ----
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_NET_SCH_CAKE=y

# ---- [opt2] 网络默认值: 烙进内核, 不需要任何脚本 ----
CONFIG_DEFAULT_BBR=y

# ---- [opt2b] 默认队列 = fq(必须先开总开关, 否则 DEFAULT_FQ 会被静默丢弃) ----
CONFIG_NET_SCH_DEFAULT=y
CONFIG_DEFAULT_FQ=y

# ---- [opt3] 把 WiFi 法规库内嵌进内核(实测修掉开机 69 秒的 regulatory.db 等待) ----
# 前置: 把 refs/regdb/ 里的 regulatory.db 与 regulatory.db.p7s 复制到
#       <内核树>/firmware/ 目录下(没有该目录就新建)
CONFIG_EXTRA_FIRMWARE="regulatory.db regulatory.db.p7s"
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
